<text x="885" y="1009" text-anchor="middle" font-size="17" font-weight="700" fill="#0b4f3a">Supabase (free plan)</text>
<text x="885" y="1033" text-anchor="middle" font-size="14.5" fill="#0b4f3a" opacity="0.85">table calls: every call + transcript</text>
<rect x="1060" y="980" width="340" height="70" rx="10" fill="#eeeafc" stroke="#4f46c8" stroke-width="2.5"/>
<text x="1230" y="1009" text-anchor="middle" font-size="17" font-weight="700" fill="#352b8f">Vaani + Cal.com + Telegram</text>
<text x="1230" y="1033" text-anchor="middle" font-size="14.5" fill="#352b8f" opacity="0.85">agent, 30-min meeting, Aangan Designers group</text>
<text x="30" y="1085" font-size="15" fill="#33312d"><tspan font-weight="700">Webhooks into Vercel:</tspan> Vaani sends each finished call to /webhook/vaani (secret key in the address).</text>
<text x="30" y="1106" font-size="15" fill="#33312d"><tspan font-weight="700"></tspan> Telegram sends Claim presses to /telegram/webhook (secret token). The server asks Cal.com whether a booking really exists.</text>
<text x="30" y="1131" font-size="15" fill="#33312d"><tspan font-weight="700">Not built / open:</tspan> HubSpot lead, our own "booked" email (needs Resend), a real Indian phone number (browser test calls only).</text>
<text x="30" y="1152" font-size="15" fill="#33312d"><tspan font-weight="700"></tspan> Vercel free plan runs timers once a day, so the 30-minute reminder fires when the site is used.</text>
<text x="717" y="1172" text-anchor="middle" font-size="16" fill="#6b6760">Aangan Studio phone enquiry agent: components map and deployment</text>
